name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: expenses_manager_test
          POSTGRES_USER: expenses_test_user
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expenses_test_user -d expenses_manager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://expenses_test_user:change_me@localhost:5432/expenses_manager_test
      TEST_DATABASE_URL: postgresql+psycopg://expenses_test_user:change_me@localhost:5432/expenses_manager_test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.14"
      - run: |
          uv sync --locked --dev
          uv run ruff check .
          uv run ruff format --check --diff .
          uv run python -m pytest
        working-directory: backend
      - name: Check database migrations
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
